name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Node 22 · Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      BFF_URL: https://api.example-media.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & contract tests
        run: npm test
